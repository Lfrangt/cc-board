<!doctype html>
<!--
 [INPUT]: 依赖 server.mjs 的 /api/state（每 1.5 秒轮询）和 /api/* 操作接口；依赖原生外壳的 ccb 消息通道（Dock 角标、拖窗口），没有外壳时静默
 [OUTPUT]: 提供总控台的全部界面：封面 / 墙两个视图、卡片、回话框、新任务、归档、干净的对话；window.ccbNew / ccbBlank 给原生菜单调用
 [POS]: 单文件界面，没有构建步骤。一个会话算什么状态只在 view() 一处判断，排位、左上角的状态标志、顶栏计数、底下的点和 Dock 角标都从它来；
        「为什么停了」由服务端的 alert 给，「交付了什么、要不要你回」由服务端的 digest 给；这里只负责显示，记「先不管」（ccb_ack）和「审完了 / 先放着」（ccb_done）。看一眼、点开都不改状态。
        正文里的本机路径（file://、~/…、/Users/…、反引号里的路径）都变成可点的链接，点了交给服务的 /api/open。
        放大看一张卡：⌘O（zoomTarget() 定哪一张）、双击卡片封面、右上角 ⤢，都走 zoomCard() → openDetail()。卡片右上角「归档」由服务定删还是留。
        新任务有两个入口：右上角（⌘N）和墙上每个列头的「＋ 新任务」；后者把那一列记在 newIn，goNew 带着它交给服务，新卡落进那一列。
        按项目分组只读服务端的 project 字段：setGroups() 定每张卡的组（墙放不下的小组并进「其他」），byProject() 排先后，placeWall() 把墙排成一个项目一列，layout() 给封面的点加组名。~/Projects/ccboard-launch-film 逐字读取本文件的样式表和 i18n 字典。
 [PROTOCOL]: Update this header on change, then check CLAUDE.md
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总控台</title>
<style>
/* 设计约定（照 Apple 质感 Playbook）：安静的底、一个强调色、状态 = 符号 + 文字、玻璃只在顶栏、圆角只用 16 / 10 / 药丸。
   动画只动 transform / opacity / filter；只有「真的在跑」的会话有持续动画。 */
:root{
  color-scheme: light dark;
  --bg: light-dark(#f5f5f7, #000);
  --surface: light-dark(#fff, #1d1d1f);
  --fill: light-dark(#f2f2f4, #2a2a2c);
  --fill-2: light-dark(#e8e8ed, #363638);
  --text: light-dark(#1d1d1f, #f5f5f7);
  --text-2: light-dark(#6e6e73, #a1a1a6);
  --text-3: light-dark(#86868b, #76767b);
  --hair: light-dark(rgba(0,0,0,.08), rgba(255,255,255,.1));
  --hair-2: light-dark(rgba(0,0,0,.16), rgba(255,255,255,.2));
  --accent: light-dark(#0a7d7d, #5bd6d6);
  --on-accent: light-dark(#fff, #002524);
  --attn: light-dark(#b25000, #ffb340);
  --danger: light-dark(#d70015, #ff6961);
  --bar: light-dark(rgba(245,245,247,.8), rgba(22,22,23,.8));
  --scrim: light-dark(rgba(0,0,0,.28), rgba(0,0,0,.55));
  --blur: saturate(180%) blur(20px);
  --shadow-pop: 0 12px 40px light-dark(rgba(0,0,0,.16), rgba(0,0,0,.6)), 0 0 0 1px var(--hair);
  --shadow-now: 0 30px 80px light-dark(rgba(0,0,0,.16), rgba(0,0,0,.7)), 0 0 0 1px var(--hair);
  --r-card: 16px; --r-ctl: 10px; --r-pill: 980px;
  --ease: cubic-bezier(.4,0,.6,1); --ease-out: cubic-bezier(.25,.1,.3,1);
  --spring: linear(0, 0.0827, 0.2515, 0.4328, 0.5933, 0.7215, 0.8172, 0.885, 0.9309, 0.9607, 0.9793, 0.9903, 0.9964, 0.9996, 1.001, 1, 1);
  --d1: 100ms; --d2: 240ms; --d3: 320ms; --d-move: 520ms;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --rows: 2; --bar-h: 52px; --gap: 12px; --lead: 16px;
  --cw: min(740px, calc(100vw - 120px)); --ch: calc(100vh - var(--bar-h) - 84px);
}
html.app{ --lead: 88px; }                 /* 原生窗口里给红绿灯让位 */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-synthesis:none;letter-spacing:-.008em;overflow:hidden}
button,textarea,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* 顶栏 */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar-h);display:flex;align-items:center;gap:12px;padding:0 14px 0 var(--lead);background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--hair);z-index:200;user-select:none;-webkit-user-select:none}
.brand{font-size:13px;font-weight:600;white-space:nowrap}
.seg{display:flex;padding:2px;border-radius:9px;background:var(--fill);gap:2px;flex:none}
.seg button{height:26px;padding:0 11px;border-radius:7px;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.seg button b{font-weight:500;color:var(--text-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.4))}
.seg button.ring b{color:var(--accent);font-weight:600} .seg button.attn b{color:var(--attn);font-weight:600}
.seg button:disabled{opacity:.42;cursor:default}
.spacer{flex:1;align-self:stretch;min-width:8px}
.hint{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtn{height:28px;padding:0 10px;border-radius:8px;color:var(--text-2);white-space:nowrap;transition:background var(--d1) var(--ease)}
.tbtn:hover{background:var(--fill);color:var(--text)}
.primary{height:28px;padding:0 14px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);font-weight:600;white-space:nowrap;transition:opacity var(--d1) var(--ease)}
.primary:hover{opacity:.88} .primary:disabled{opacity:.42;cursor:default}
.plain{height:28px;padding:0 12px;border-radius:var(--r-pill);color:var(--text-2);white-space:nowrap} .plain:hover{background:var(--fill);color:var(--text)}
.bordered{height:28px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--hair-2);white-space:nowrap;transition:background var(--d1) var(--ease)}
.bordered:hover{background:var(--fill)} .bordered.danger{color:var(--danger)}

main{position:absolute;inset:var(--bar-h) 0 0 0}
.blank{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-3);text-align:center;pointer-events:none}

/* 视图一：墙（一屏 8 或 12 格） */
body.wall main{overflow:auto;padding:var(--gap)}
body.wall #stage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);grid-auto-rows:calc((100vh - var(--bar-h) - var(--gap) * 2 - (var(--rows) - 1) * var(--gap)) / var(--rows))}
@media (max-width:1500px){body.wall #stage{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){body.wall #stage{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){body.wall #stage{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(340px,auto)}}
body.wall .card{transition:transform var(--d-move) var(--spring)}
body.wall .pager,body.flow #rows{display:none}

/* 视图二：封面（正在跟进的那张在最前面，在跑的退到后面变模糊） */
body.flow main{overflow:hidden;perspective:1800px}
body.flow #stage{position:absolute;inset:0}
body.flow .card{position:absolute;left:50%;top:calc(50% - 14px);width:var(--cw);height:var(--ch);margin:calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);will-change:transform,filter,opacity;
  transition:transform var(--d-move) var(--spring),filter var(--d3) var(--ease),opacity var(--d3) var(--ease),box-shadow var(--d3) var(--ease)}
body.flow .card:not(.side){box-shadow:var(--shadow-now)}
body.flow .card.side{cursor:pointer}
body.flow .card.side>*{pointer-events:none}
body.flow .card.side .chead .ib{opacity:0}
/* 封面：每张卡片的上半截是它的「封面」——大标题、一句结论、要你做的事。扫一眼就知道是什么、到哪一步了；正文在下面，要细看再看。
   质感靠灰阶、细边和光，不靠颜色（11/12 他否了按会话上色：「没什么质感，很 low」）。颜色只留给状态：青 = 交付了 / 在跑，琥珀 = 要你动手 */
body.flow main{background:radial-gradient(58% 52% at 50% 40%,light-dark(rgba(0,0,0,.035),rgba(255,255,255,.055)),transparent 72%),var(--bg)}
body.flow .card{background:linear-gradient(180deg,light-dark(#fff,#262628),var(--surface) 36%);box-shadow:0 18px 48px light-dark(rgba(0,0,0,.1),rgba(0,0,0,.55)),0 0 0 1px var(--hair),inset 0 1px 0 light-dark(#fff,rgba(255,255,255,.07))}
body.flow .card:not(.side){box-shadow:var(--shadow-now),inset 0 1px 0 light-dark(#fff,rgba(255,255,255,.08))}
body.flow .chead{padding:18px 16px 0 26px;min-height:46px}
body.flow .meta{height:28px;font-size:13.5px;gap:7px}
body.flow :is(.s-busy,.bg,.s-review,.s-reply,.s-ask,.alert) .meta{padding:0 12px 0 8px}
body.flow .meta::before{width:16px;height:16px;font-size:10.5px;line-height:16px}
body.flow .s-busy .meta::before,body.flow .bg .meta::before{width:8px;height:8px;margin:0 4px}
body.flow .title{margin:16px 26px 0;font-size:clamp(22px,1.6vw,31px);line-height:1.22;font-weight:600;letter-spacing:-.02em}
body.flow .head{margin:12px 26px 0;font-size:clamp(16px,1.08vw,20px);line-height:1.55;font-weight:500;color:color-mix(in srgb,var(--text) 86%,transparent);-webkit-line-clamp:3}
body.flow .ask{margin:14px 26px 0;padding:11px 15px;border-radius:12px;font-size:clamp(15px,.98vw,18px)}
body.flow .you{margin:16px 26px 0;font-size:13px;color:var(--text-3);-webkit-line-clamp:1}
body.flow .body{margin-top:14px;padding:16px 26px 18px}
body.flow .md{font-size:15px;line-height:1.78;max-width:40em}
body.flow .md p{margin:0 0 12px} body.flow .md li{margin:4px 0} body.flow .md ul,body.flow .md ol{margin:0 0 12px}
body.flow .md h3{font-size:17px;margin:22px 0 8px} body.flow .md h4,body.flow .md h5{font-size:15.5px;margin:18px 0 6px}
body.flow .md table{font-size:14px} body.flow .md code,body.flow .md pre{font-size:13px}
body.flow .lbl{font-size:12px;margin-bottom:8px}
body.flow .done{height:30px;padding:0 15px;font-size:13.5px}
/* 两边的卡片：标题和结论照常读得清，正文淡到只剩一点纹理（离得远本来就看不清，留着全亮只是一片灰字，反而费眼） */
body.flow .card .you,body.flow .card .body,body.flow .card .reply{transition:opacity var(--d2) var(--ease)}
body.flow .card.side .you,body.flow .card.side .reply{opacity:0} body.flow .card.side .body{opacity:.28}
body.flow .card.side .done{visibility:hidden}
.pager{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:6px;color:var(--text-3);font-size:12px;z-index:150;user-select:none;-webkit-user-select:none}
.pager button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--text-2)} .pager button:hover{background:var(--fill-2);color:var(--text)}
.pager #pos{display:flex;align-items:center;justify-content:center;gap:2px;min-width:150px}
/* 底下一排点：每张卡一个。琥珀 = 要你动手，青 = 等你审，空心 = 在跑，灰 = 处理过 */
.pager #pos button{width:16px;height:22px;border-radius:6px;display:grid;place-items:center}
.pager #pos button::before{content:"";width:7px;height:7px;border-radius:50%;box-sizing:border-box;background:var(--text-3);opacity:.5;transition:transform var(--d2) var(--ease),opacity var(--d2) var(--ease)}
.pager #pos .act::before{background:var(--attn);opacity:1} .pager #pos .review::before{background:var(--accent);opacity:1}
.pager #pos .busy::before{background:none;border:1.5px solid var(--accent);opacity:.9}
.pager #pos .cur::before{transform:scale(1.6);opacity:1}
/* 按项目分组（11/12 Khalil 16:06：「FretFlow 的放一块，总控台的放另外一块，不要混起来」；16:4x：按行分会把后面的项目挤出屏幕，「改成竖着的，三个任务就是三列」）
   墙：两个以上项目有卡时，每个项目一列（body.cols），列头写项目名 + 张数，列里的卡竖着排、各自滚动；页面本身不滚，每个项目打开就都在第一屏。
   一屏的格子数和平铺一样（宽屏 4 × 2，「12 格」是 4 × 3）：横向的 4 格按各项目的卡数分给它们（lanes()），卡多的项目占 2～3 格宽、在自己那块里横着排满再往下；
   卡片大小因此和平铺一样，一屏照样放 8 张（17:3x 他：「这样还是只有 4 个，效率很低」）。底下留 28px 露出下一行的边，告诉你这一块还能往下滚。手机宽度：各块叠成一列往下排。
   封面：同一项目的卡挨着，底下的点按项目隔开、带名字；卡片左上角写项目名。只有一个项目时都不显示。 */
body.wall.cols main{overflow:hidden}
body.wall.cols #stage{grid-template-columns:var(--gtpl);grid-template-rows:minmax(0,1fr);grid-auto-rows:auto;column-gap:calc(var(--gap) * 2);height:calc(100vh - var(--bar-h) - var(--gap) * 2);transition:grid-template-columns var(--d3) var(--ease)}
.gcol{display:flex;flex-direction:column;min-width:0;min-height:0;animation:gcol-in var(--d3) var(--ease) both}
.ghead{flex:none;display:flex;align-items:baseline;gap:8px;height:30px;padding:2px 4px 0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);user-select:none;-webkit-user-select:none}
.ghead b{font-weight:500;color:var(--text-3)}
.gbody{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--k,1),minmax(0,1fr));grid-auto-rows:calc((100vh - var(--bar-h) - var(--gap) * 2 - 30px - 28px - var(--rows) * var(--gap)) / var(--rows));align-content:start;gap:var(--gap);overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;border-radius:18px}
.gbody{overflow-anchor:none}            /* 不要滚动锚定：卡片一张张插进列里时，浏览器会为了「保持看到的内容不动」把列滚到中间 */
.ghead .gfold{margin-left:auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity var(--d1) var(--ease),background var(--d1) var(--ease),color var(--d1) var(--ease)}
.gcol:hover .ghead .gfold,.ghead .gfold:focus-visible{opacity:1}
.ghead .gfold:hover{background:var(--fill);color:var(--text)}
/* 列头的「＋ 新任务」（11/13 Khalil：「在每一个主题下面再放一个新任务」）：一直看得见，平时灰，指上去才亮 */
.ghead .gnew{margin-left:auto;height:26px;padding:0 9px 0 7px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--text-3);transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.ghead .gnew:hover,.ghead .gnew:focus-visible{background:var(--fill);color:var(--text)}
.ghead .gnew + .gfold{margin-left:2px}
/* 收起的列：一条竖着的窄条，写项目名和张数；有要你动手的亮琥珀点，有交付等你看的亮青点。点整条展开 */
.gcol.folded{cursor:pointer;border-radius:14px;background:var(--fill);transition:background var(--d1) var(--ease)}
.gcol.folded:hover{background:var(--surface)}
.gcol.folded .gbody,.gcol.folded .gfold{display:none}
.gcol.folded .ghead{writing-mode:vertical-rl;height:auto;padding:14px 0;align-items:center;gap:10px;color:var(--text-2)}
.gcol.folded:hover .ghead{color:var(--text)}
.gdots{display:flex;gap:5px} .gdots i{width:7px;height:7px;border-radius:50%} .gdots .act{background:var(--attn)} .gdots .review{background:var(--accent)}
.pager #pos button.pg.folded{color:var(--text-3);opacity:.75} .pager #pos button.pg.folded:hover{opacity:1;color:var(--text)}
@keyframes gcol-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:700px){body.wall.cols main{overflow:auto} body.wall.cols #stage{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto} .gcol.folded .ghead{writing-mode:horizontal-tb;height:44px;padding:0 14px} .gbody{overflow:visible;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(340px,auto)}}
.chead .proj{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body:not(.grouped) .chead .proj,body.wall .chead .proj{display:none}
.pager #pos button.pg{width:auto;height:22px;padding:0 4px 0 10px;font-size:11px;color:var(--text-3);white-space:nowrap}
.pager #pos button.pg:first-child{padding-left:0}
.pager #pos button.pg::before{display:none}
.pager #pos button.pg:hover{color:var(--text)}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-card);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card[hidden]{display:none}
.chead{display:flex;align-items:center;gap:8px;padding:12px 10px 0 16px;min-height:36px}
.grow{flex:1;min-width:8px}
/* 状态标志在左上角：一个符号 + 字。琥珀色 = 要你动手（等你选 / 停住了 / 待跟进），青色 = 交付了等你审、在跑，灰色 = 处理过 / 空闲 */
.meta{display:flex;align-items:center;gap:6px;height:22px;padding:0;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;flex:none;color:var(--text-2)}
.s-busy .meta,.bg .meta,.s-review .meta,.s-reply .meta,.s-ask .meta,.alert .meta{padding:0 9px 0 6px}
.meta::before{content:"";flex:none;width:13px;height:13px;border-radius:50%;box-sizing:border-box;font:700 9px/13px var(--font);text-align:center;color:var(--surface);background:var(--text-3)}
.s-busy .meta{color:var(--text);background:var(--fill-2)}
.s-busy .meta::before{width:7px;height:7px;margin:0 3px;background:var(--accent);animation:live 1.6s var(--ease) infinite}
.bg .meta{color:var(--text);background:var(--fill-2)} .bg .meta::before{width:7px;height:7px;margin:0 3px;background:var(--accent);animation:live 1.6s var(--ease) infinite}
.s-review .meta{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.s-review .meta::before{content:"✓";background:var(--accent);color:var(--on-accent)}
.s-reply .meta,.s-ask .meta,.alert .meta{color:var(--attn);background:color-mix(in srgb,var(--attn) 16%,transparent)}
.s-reply .meta::before{content:"↩";background:var(--attn)} .s-ask .meta::before{content:"?";background:var(--attn)}
.alert .meta::before{content:"!";background:var(--attn);animation:none;margin:0}
body.flow .alert .meta::before{width:16px;height:16px;margin:0}
.s-handled .meta::before{content:"✓";background:none;color:var(--text-3);border:1.5px solid var(--text-3);font-size:8px;line-height:10px}
.s-idle .meta::before{width:9px;height:9px;margin:0 2px;background:none;border:1.5px solid var(--text-3)}
.s-stopped:not(.alert) .meta::before{width:8px;height:8px;margin:0 2px;border-radius:2px}
@keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.title{margin:8px 16px 0;font-size:14.5px;line-height:1.3;font-weight:600;word-break:break-word;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-handled .title,.s-fyi .title,.s-idle .title{font-weight:500}
